<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.5/moment-timezone-with-data-1970-2030.min.js"></script>
</head>
<body>
    <div class="center">
    <h1>World Clock</h1>
    <select id="city">
        <option value="">Select a city</option>
        <option value="">Barcelona</option>
        <option value="">Tokyo</option>
        <option value="">New York</option>
    </select>

    <div id="display-city">
        <div class="left-side" id="lisbon">
            <div>
                <h2>Lisbon 🇵🇹</h2>
                <div class="date"></div>
            </div>
            <div class="time"></div>
        </div>
    
        <div class="left-side" id="amsterdam">
            <div>
                <h2>Amsterdam 🇳🇱</h2>
                <div class="date"></div>
            </div>
            <div class="time"></div>
        </div>
    </div>
    </div>
    <footer>This project was coded by <a href="https://github.com/Danicfragoso"> Daniela Correia Fragoso </a>and opened sourced on github and hosted by <a href="">Netlify</a></footer>
    <script src="src/index.js"></script>
</body>
</html>
